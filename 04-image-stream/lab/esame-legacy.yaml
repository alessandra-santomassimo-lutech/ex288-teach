# Esercizio finale (modulo 04), requisito 8.
# Applica questo file nel progetto ${LAB}-m04-exam (dopo aver creato l'image stream tools).
# Il Deployment "legacy" NON funziona come richiesto: non correggere questo file,
# correggi le risorse sul cluster senza eliminare il Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  labels:
    app: legacy
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"tools:httpd"},"fieldPath":"spec.template.spec.containers[?(@.name==\"apache\")].image","paused":true}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy
  template:
    metadata:
      labels:
        app: legacy
    spec:
      containers:
      - name: httpd
        image: tools:httpd
        ports:
        - containerPort: 8080
