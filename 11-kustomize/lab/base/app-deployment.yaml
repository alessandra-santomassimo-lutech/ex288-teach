apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-node
  labels:
    app: hello-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-node
  template:
    metadata:
      labels:
        app: hello-node
    spec:
      containers:
      - name: hello-node
        # Nome breve dell'image stream del progetto: richiede "oc set image-lookup hello-node".
        # Gli overlay cambiano il tag con il campo "images".
        image: hello-node:latest
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-env            # kustomize lo riscrive con il nome generato (con hash)
        env:
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: database-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: database-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: database-password
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/app
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: app-config
