# Scenario 2 (modulo 11): due patch che non fanno quello che dovrebbero.
# Non correggere questo file: applicalo come indicato nel README, indaga, correggi sul cluster (o in una TUA copia della cartella).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    scenario: m11-2
resources:
- deployment.yaml
patches:
# Patch strategic merge: porta le repliche a 2
- path: patch-repliche.yaml
# Patch JSON 6902 con target: aggiunge la variabile TEAM al container
- target:
    kind: Deployment
    name: k2-websrv
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
      - name: TEAM
        value: ex288
