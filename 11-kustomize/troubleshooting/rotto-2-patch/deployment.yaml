apiVersion: apps/v1
kind: Deployment
metadata:
  name: k2-webserver
  labels:
    app: k2-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k2-webserver
  template:
    metadata:
      labels:
        app: k2-webserver
    spec:
      containers:
      - name: httpd
        image: registry.access.redhat.com/ubi9/httpd-24
        ports:
        - containerPort: 8080
