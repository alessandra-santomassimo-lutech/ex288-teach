# Scenario 3 (modulo 01): il Service ha endpoint ma la route risponde 503.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pay
  labels:
    app: pay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pay
  template:
    metadata:
      labels:
        app: pay
    spec:
      containers:
      - name: httpd
        image: registry.access.redhat.com/ubi9/httpd-24
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pay
  labels:
    app: pay
spec:
  selector:
    app: pay
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: pay
  labels:
    app: pay
spec:
  to:
    kind: Service
    name: pay-svc
  port:
    targetPort: web
