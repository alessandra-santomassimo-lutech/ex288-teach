# Due Secret equivalenti scritti in modo diverso (passo 3.3).
# 1) stringData: valori in chiaro, l'API server li codifica in base64 e li salva in "data".
apiVersion: v1
kind: Secret
metadata:
  name: yaml-stringdata
type: Opaque
stringData:
  username: demo
  password: Pa55-demo
---
# 2) data: valori GIA' codificati in base64 (printf 'demo' | base64 -> ZGVtbw==).
#    Attenzione: codificare due volte e' un errore classico (scenario 6 della sezione 6).
apiVersion: v1
kind: Secret
metadata:
  name: yaml-data
type: Opaque
data:
  username: ZGVtbw==
  password: UGE1NS1kZW1v
