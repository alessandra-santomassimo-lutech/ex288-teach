# Scenario 4 (modulo 12): il clone riesce ma i test non trovano il codice.
# Richiede hello-pipeline e npm-test del laboratorio (passi 3.4-3.5).
# Non correggere questo file: applicalo, indaga, correggi sul cluster.
# Applica con: sed "s|GIT_REPO_DA_SOSTITUIRE|$GIT_REPO|" rotto-4-emptydir.yaml | oc apply -f -
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ts4-run
  labels:
    scenario: m12-4
spec:
  pipelineRef:
    name: hello-pipeline
  taskRunTemplate:
    serviceAccountName: pipeline
  params:
  - name: GIT_URL
    value: GIT_REPO_DA_SOSTITUIRE
  - name: DEPLOY
    value: "false"
  workspaces:
  - name: shared
    emptyDir: {}
