# Scenario 6 (modulo 12): la pipeline si ferma e il Deployment non viene aggiornato.
# Richiede hello-pipeline e npm-test del laboratorio (passi 3.4-3.5).
# Non correggere questo file: applicalo, indaga, correggi sul cluster.
# Applica con: sed "s|GIT_REPO_DA_SOSTITUIRE|$GIT_REPO|" rotto-6-test-fallito.yaml | oc apply -f -
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ts6-run
  labels:
    scenario: m12-6
spec:
  pipelineRef:
    name: hello-pipeline
  taskRunTemplate:
    serviceAccountName: pipeline
  params:
  - name: GIT_URL
    value: GIT_REPO_DA_SOSTITUIRE
  - name: IMAGE_TAG
    value: ts6
  - name: FAIL_TESTS
    value: "true"
  workspaces:
  - name: shared
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 500Mi
