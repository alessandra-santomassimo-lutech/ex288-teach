apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hello-chart.fullname" . }}-db
  labels:
    {{- include "hello-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-name: {{ .Values.db.name | quote }}
  database-user: {{ .Values.db.user | quote }}
  database-password: {{ required "db.password è obbligatorio" .Values.db.password | quote }}
