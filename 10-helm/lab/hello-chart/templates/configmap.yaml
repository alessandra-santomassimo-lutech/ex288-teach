apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hello-chart.fullname" . }}-config
  labels:
    {{- include "hello-chart.labels" . | nindent 4 }}
data:
  app.properties: |
    {{- .Values.app.config | trim | nindent 4 }}
    release={{ .Release.Name }}
    revisione.helm={{ .Release.Revision }}
