apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
  {{ toYaml .Values.labels | indent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      containers:
      - name: httpd
        image: {{ .Values.app.image }}
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: {{ .Values.app.resources.limits.memory }}
