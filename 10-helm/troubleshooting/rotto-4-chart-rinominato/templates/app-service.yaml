apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello-chart.fullname" . }}-app
  labels:
    {{- include "hello-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  selector:
    {{- include "hello-chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
  - name: http
    port: 8080
    targetPort: http
