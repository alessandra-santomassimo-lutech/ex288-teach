# Esercizio finale del modulo 08: Deployment "orders" fornito dal team di sviluppo.
# Applicalo SENZA modificarlo nel progetto ${LAB}-m08-exam, poi correggi sul cluster
# il Deployment finche' non soddisfa i requisiti del README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: orders
        image: api:latest
        ports:
        - containerPort: 8080
        env:
        - name: REQUIRED_ENV
          value: APP_MESSAGE
        resources:
          requests:
            cpu: 50m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 16Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  labels:
    app: orders
spec:
  selector:
    app: orders
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: orders
  labels:
    app: orders
spec:
  to:
    kind: Service
    name: orders
  port:
    targetPort: http
