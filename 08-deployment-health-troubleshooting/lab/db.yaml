# Database PostgreSQL per il passo 3.10 (credenziali in un Secret, come nel modulo 07).
apiVersion: v1
kind: Secret
metadata:
  name: db-cred
  labels:
    app: db
type: Opaque
stringData:
  USER: appuser
  PASSWORD: Db-Pass-08
  DATABASE: appdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  strategy:
    type: Recreate                  # un solo pod alla volta: necessario con un volume RWO (passo 3.4)
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: postgresql
        image: registry.redhat.io/rhel9/postgresql-16
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: db-cred
          prefix: POSTGRESQL_
        readinessProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: db
spec:
  selector:
    app: db
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
