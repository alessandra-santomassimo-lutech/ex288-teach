# Scenario 2 (modulo 08): t2 e' Running ma il Service non ha endpoint pronti.
# Non correggere questo file: applicalo, indaga, correggi sul cluster.
# Prerequisito: image stream "hello" con lookup locale nel progetto (passo 3.1 del README).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t2
  labels:
    app: t2
    scenario: m08-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t2
  template:
    metadata:
      labels:
        app: t2
    spec:
      containers:
      - name: hello
        image: hello:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: t2
  labels:
    app: t2
    scenario: m08-2
spec:
  selector:
    app: t2
  ports:
  - name: http
    port: 8080
    targetPort: 8080
